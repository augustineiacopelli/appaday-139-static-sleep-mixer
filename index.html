<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>139. Static Sleep Mixer</title>
<meta name="description" content="Mix white, pink, and brown noise into a steady sleep sound, then let a sleep timer fade it out.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1020;
    --panel: #141a30;
    --panel-2: #1c2342;
    --ink: #c9cfe0;
    --muted: #6b7390;
    --accent: #e0a458;
    --white: #e6e8f0;
    --pink: #e79bb8;
    --brown: #a4714c;
    --line: #222a48;
    --track: #262e4f;
    --font: 'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-weight: 300;
    font-size: clamp(15px, 1.2vw + 11px, 17px);
    line-height: 1.45;
    overflow-x: hidden;
  }

  button, input { font: inherit; color: inherit; }

  .sr {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  /* Header and footer */
  header.bar, footer.bar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  header.bar {
    justify-content: space-between;
    padding-top: calc(6px + env(safe-area-inset-top, 0px));
    border-bottom: 1px solid var(--line);
  }
  footer.bar {
    justify-content: center;
    gap: 6px;
    border-top: 1px solid var(--line);
    padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px));
  }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .brand .num { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
  .brand .name { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar a {
    color: var(--muted);
    text-decoration: none;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    min-height: 44px;
    padding: 0 4px;
    white-space: nowrap;
  }
  .bar a:hover { color: var(--accent); }

  /* Main */
  main#app {
    flex: 1 1 auto;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(20px, 4vh, 36px);
    padding: clamp(20px, 5vh, 44px) 16px;
  }

  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(14px, 2.5vh, 22px);
    text-align: center;
  }
  .status {
    margin: 0;
    font-size: clamp(22px, 3vw + 12px, 34px);
    font-weight: 300;
    letter-spacing: 0.01em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    min-height: 1.3em;
  }
  .note {
    margin: -8px 0 0;
    max-width: 30ch;
    font-size: 13px;
    color: var(--muted);
  }

  /* Play button */
  .play {
    width: clamp(96px, 28vw, 132px);
    height: clamp(96px, 28vw, 132px);
    border-radius: 50%;
    border: 1.5px solid #2e375c;
    background: radial-gradient(circle at 50% 38%, var(--panel-2), #0f1428 72%);
    color: var(--ink);
    display: grid;
    place-items: center;
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.4s ease, color 0.4s ease;
  }
  .play:hover { border-color: #3d4773; }
  .play[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .glyph { width: 38%; height: 38%; fill: currentColor; }
  .glyph.g-play { transform: translateX(6%); }
  .play .g-pause { display: none; }
  .play[aria-pressed="true"] .g-play { display: none; }
  .play[aria-pressed="true"] .g-pause { display: block; }

  @media (prefers-reduced-motion: no-preference) {
    .play[aria-pressed="true"] { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(224, 164, 88, 0), 0 0 22px 2px rgba(224, 164, 88, 0.08); }
      50% { box-shadow: 0 0 0 10px rgba(224, 164, 88, 0.05), 0 0 50px 8px rgba(224, 164, 88, 0.17); }
    }
  }

  /* Layer cards */
  .layers, .controls {
    width: 100%;
    max-width: 880px;
  }
  .layers {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  .layer {
    --c: var(--ink);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 6px 16px 4px;
    transition: border-color 0.4s ease;
  }
  .layer.on { border-color: color-mix(in srgb, var(--c) 28%, var(--line)); }
  .toggle {
    width: 100%;
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .swatch {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--c);
    opacity: 0.35;
    transition: opacity 0.4s ease, box-shadow 0.4s ease;
  }
  .layer.on .swatch { opacity: 1; box-shadow: 0 0 14px 1px color-mix(in srgb, var(--c) 45%, transparent); }
  .lname { flex: 1 1 auto; font-weight: 500; font-size: clamp(16px, 0.6vw + 14px, 18px); }
  .lstate {
    flex: 0 0 auto;
    min-width: 44px;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 999px;
    color: var(--muted);
    background: #0f1428;
  }
  .layer.on .lstate { color: var(--bg); background: var(--accent); }
  .ldesc { margin: 0; font-size: 13px; color: var(--muted); }
  .layer .range { --fill: var(--c); }
  .layer.off .range, .layer.off .lname { opacity: 0.55; }

  /* Range inputs */
  .range {
    --p: 50%;
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    height: 44px;
    margin: 0;
    padding: 0;
    background: transparent;
    cursor: pointer;
    touch-action: pan-y;
  }
  .range:focus { outline: none; }
  .range:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  .range::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--fill, var(--accent)) 0 var(--p), var(--track) var(--p) 100%);
  }
  .range::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 28px;
    height: 28px;
    margin-top: -11px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    box-shadow: 0 0 0 4px var(--bg);
  }
  .range::-moz-range-track { height: 6px; border-radius: 3px; background: var(--track); }
  .range::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--fill, var(--accent)); }
  .range::-moz-range-thumb {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--ink);
    box-shadow: 0 0 0 4px var(--bg);
  }

  /* Master and timer */
  .controls {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }
  .row { display: flex; flex-direction: column; gap: 4px; }
  .rowlabel { margin: 0; font-size: 14px; color: var(--muted); }
  .master .rowlabel { display: flex; justify-content: space-between; }
  .master .val { font-variant-numeric: tabular-nums; color: var(--ink); }

  .seg {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    padding: 4px;
    margin-top: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .seg button {
    min-height: 44px;
    min-width: 0;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: var(--muted);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--accent); }

  button:focus { outline: none; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .seg button:focus-visible { outline-offset: -2px; }

  @media (min-width: 720px) {
    .layers { grid-template-columns: repeat(3, 1fr); }
    .controls { grid-template-columns: 1fr 1.4fr; gap: 28px; align-items: end; }
  }
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <span class="num">139</span>
    <span class="name">Static Sleep Mixer</span>
  </div>
  <a href="https://augustineiacopelli.github.io/appaday/">AppADay</a>
</header>

<main id="app">
  <section class="hero">
    <p id="status" class="status">Tap play to begin</p>
    <p id="iosNote" class="note" hidden>On iPhone, the ring/silent switch mutes web audio. Flip it to ring.</p>
    <button id="btnPlay" class="play" type="button" aria-pressed="false" aria-label="Play sound">
      <svg class="glyph g-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.8v14.4l11.2-7.2z"/></svg>
      <svg class="glyph g-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>
    </button>
  </section>

  <section class="layers" id="layers" aria-label="Noise layers">
    <div class="layer" id="layerWhite" style="--c: var(--white)">
      <button class="toggle" type="button" data-layer="white" aria-pressed="false">
        <span class="swatch" aria-hidden="true"></span>
        <span class="lname">White<span class="sr"> noise</span></span>
        <span class="lstate" aria-hidden="true">Off</span>
      </button>
      <p class="ldesc">Bright even hiss, like a box fan</p>
      <input class="range" type="range" min="0" max="100" step="1" data-layer="white" aria-label="White noise volume">
    </div>
    <div class="layer" id="layerPink" style="--c: var(--pink)">
      <button class="toggle" type="button" data-layer="pink" aria-pressed="false">
        <span class="swatch" aria-hidden="true"></span>
        <span class="lname">Pink<span class="sr"> noise</span></span>
        <span class="lstate" aria-hidden="true">Off</span>
      </button>
      <p class="ldesc">Softer and balanced, like steady rain</p>
      <input class="range" type="range" min="0" max="100" step="1" data-layer="pink" aria-label="Pink noise volume">
    </div>
    <div class="layer" id="layerBrown" style="--c: var(--brown)">
      <button class="toggle" type="button" data-layer="brown" aria-pressed="false">
        <span class="swatch" aria-hidden="true"></span>
        <span class="lname">Brown<span class="sr"> noise</span></span>
        <span class="lstate" aria-hidden="true">Off</span>
      </button>
      <p class="ldesc">Deep low rumble, like distant surf</p>
      <input class="range" type="range" min="0" max="100" step="1" data-layer="brown" aria-label="Brown noise volume">
    </div>
  </section>

  <section class="controls">
    <div class="row master">
      <label class="rowlabel" for="masterVol"><span>Volume</span><span class="val" id="masterVal">70</span></label>
      <input class="range" id="masterVol" type="range" min="0" max="100" step="1">
    </div>
    <div class="row timer">
      <p class="rowlabel" id="timerLabel">Sleep timer, in minutes</p>
      <div class="seg" id="timerSeg" role="group" aria-labelledby="timerLabel">
        <button type="button" data-min="0" aria-pressed="true">Off</button>
        <button type="button" data-min="15" aria-pressed="false">15</button>
        <button type="button" data-min="30" aria-pressed="false">30</button>
        <button type="button" data-min="45" aria-pressed="false">45</button>
        <button type="button" data-min="60" aria-pressed="false">60</button>
        <button type="button" data-min="90" aria-pressed="false">90</button>
      </div>
    </div>
  </section>
</main>

<footer class="bar">
  <span>App 139 of</span>
  <a href="https://augustineiacopelli.github.io/appaday/">AppADay</a>
</footer>

<script>
(function () {
  'use strict';

  /* ===== Section 1: constants and state ===== */
  const STORAGE_KEY = 'appaday-139-mixer';
  const BUFFER_SECONDS = 8;
  const SEAM_SECONDS = 0.25;
  const PEAK = 0.9;
  const RAMP_TC = 0.03;
  const LAYER_FADE = 0.4;
  const TIMER_FADE_MAX = 120;
  const LAYERS = ['white', 'pink', 'brown'];

  const TIMER_CHOICES = [0, 15, 30, 45, 60, 90];
  const PLAY_FADE = 0.3;
  const PAUSE_FADE = 0.3;
  const SLIDER_FADE = 0.05;

  const DEFAULTS = {
    layers: {
      white: { on: false, vol: 0.5 },
      pink: { on: true, vol: 0.6 },
      brown: { on: false, vol: 0.5 }
    },
    master: 0.7,
    timerMin: 0
  };

  const state = {
    ctx: null,
    master: null,
    layers: {},
    masterVol: DEFAULTS.master,
    playing: false,
    timerMin: DEFAULTS.timerMin,
    timerEnd: null,
    timerFade: 0,
    timerHandle: null,
    tickHandle: null,
    pauseHandle: null,
    unsupported: false
  };
  LAYERS.forEach(function (n) {
    state.layers[n] = { on: DEFAULTS.layers[n].on, vol: DEFAULTS.layers[n].vol, src: null, gain: null };
  });

  /* ===== Section 2: noise generators ===== */
  function genWhite(n) {
    const a = new Float32Array(n);
    for (let i = 0; i < n; i++) a[i] = Math.random() * 2 - 1;
    return a;
  }

  function genPink(n) {
    const a = new Float32Array(n);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      a[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362;
      b6 = w * 0.115926;
    }
    return a;
  }

  function genBrown(n) {
    const a = new Float32Array(n);
    let last = 0;
    for (let i = 0; i < n; i++) {
      const w = Math.random() * 2 - 1;
      last = (last + 0.02 * w) / 1.02;
      a[i] = last * 3.5;
    }
    return a;
  }

  const GENERATORS = { white: genWhite, pink: genPink, brown: genBrown };

  function removeDC(arr) {
    let sum = 0;
    for (let i = 0; i < arr.length; i++) sum += arr[i];
    const mean = sum / arr.length;
    for (let i = 0; i < arr.length; i++) arr[i] -= mean;
    return arr;
  }

  function normalize(arr) {
    let peak = 0;
    for (let i = 0; i < arr.length; i++) {
      const v = Math.abs(arr[i]);
      if (v > peak) peak = v;
    }
    if (peak > 0) {
      const k = PEAK / peak;
      for (let i = 0; i < arr.length; i++) arr[i] *= k;
    }
    return arr;
  }

  // Equal power crossfade of the tail into the head, then drop the tail.
  // The last kept sample is followed by head[0], which now equals the
  // first dropped sample, so the loop point is continuous.
  function seamLoop(arr, sampleRate) {
    const n = arr.length;
    const m = Math.min(Math.floor(SEAM_SECONDS * sampleRate), Math.floor(n / 4));
    if (m < 2) return arr;
    const out = arr.slice(0, n - m);
    for (let i = 0; i < m; i++) {
      const t = i / m;
      const fadeIn = Math.sin(t * Math.PI / 2);
      const fadeOut = Math.cos(t * Math.PI / 2);
      out[i] = arr[i] * fadeIn + arr[n - m + i] * fadeOut;
    }
    return out;
  }

  function buildBuffer(ctx, type) {
    const sr = ctx.sampleRate;
    const raw = GENERATORS[type](Math.floor(BUFFER_SECONDS * sr), sr);
    const data = normalize(removeDC(seamLoop(raw, sr)));
    const buf = ctx.createBuffer(1, data.length, sr);
    buf.getChannelData(0).set(data);
    return buf;
  }

  /* ===== Section 3: audio engine ===== */
  function unlockAudio() {
    if (!state.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) {
        state.unsupported = true;
        return Promise.resolve();
      }
      const ctx = new AC();
      state.ctx = ctx;

      // Brick wall limiter so three full layers never clip.
      const limiter = ctx.createDynamicsCompressor();
      limiter.threshold.value = -3;
      limiter.knee.value = 0;
      limiter.ratio.value = 20;
      limiter.attack.value = 0.003;
      limiter.release.value = 0.25;
      limiter.connect(ctx.destination);

      const master = ctx.createGain();
      master.gain.value = state.masterVol;
      master.connect(limiter);
      state.master = master;

      LAYERS.forEach(function (name) {
        const L = state.layers[name];
        const gain = ctx.createGain();
        gain.gain.value = 0;
        gain.connect(master);
        const src = ctx.createBufferSource();
        src.buffer = buildBuffer(ctx, name);
        src.loop = true;
        src.connect(gain);
        src.start();
        L.src = src;
        L.gain = gain;
      });

      if (ctx.addEventListener) ctx.addEventListener('statechange', onCtxState);
      else ctx.onstatechange = onCtxState;
    }
    const c = state.ctx;
    if (c.state === 'suspended' || c.state === 'interrupted') {
      return c.resume().catch(function () {});
    }
    return Promise.resolve();
  }

  function setLayerGain(name, target, fade) {
    const L = state.layers[name];
    if (!state.ctx || !L.gain) return;
    const p = L.gain.gain;
    const now = state.ctx.currentTime;
    p.cancelScheduledValues(now);
    p.setValueAtTime(p.value, now);
    p.linearRampToValueAtTime(target, now + fade);
  }

  function applyLayer(name, fade) {
    const L = state.layers[name];
    setLayerGain(name, L.on ? L.vol : 0, fade == null ? LAYER_FADE : fade);
  }

  // Rebuilds the full master automation: a short settle ramp to the
  // master level, then (if a timer runs) a hold and a linear fade to 0.
  function scheduleMaster(fromZero) {
    const ctx = state.ctx;
    if (!ctx || !state.master) return;
    const p = state.master.gain;
    const now = ctx.currentTime;
    const v = state.masterVol;
    p.cancelScheduledValues(now);
    p.setValueAtTime(fromZero ? 0 : p.value, now);
    const settle = now + (fromZero ? PLAY_FADE : SLIDER_FADE);

    if (state.timerEnd === null) {
      p.linearRampToValueAtTime(v, settle);
      return;
    }
    const end = state.timerEnd;
    const fade = state.timerFade;
    const fadeStart = end - fade;
    if (settle >= end) {
      p.linearRampToValueAtTime(0, Math.max(end, now + SLIDER_FADE));
    } else if (settle <= fadeStart) {
      p.linearRampToValueAtTime(v, settle);
      p.setValueAtTime(v, fadeStart);
      p.linearRampToValueAtTime(0, end);
    } else {
      const level = fade > 0 ? v * (end - settle) / fade : 0;
      p.linearRampToValueAtTime(level, settle);
      p.linearRampToValueAtTime(0, end);
    }
  }

  function setMaster(v) {
    state.masterVol = v;
    const ctx = state.ctx;
    if (!ctx || !state.master) return;
    const p = state.master.gain;
    const now = ctx.currentTime;
    if (!state.playing) {
      if (!state.pauseHandle) {
        p.cancelScheduledValues(now);
        p.setValueAtTime(v, now);
      }
      return;
    }
    if (state.timerEnd !== null) {
      scheduleMaster(false);
      return;
    }
    p.cancelScheduledValues(now);
    p.setValueAtTime(p.value, now);
    p.setTargetAtTime(v, now, RAMP_TC);
  }

  function anyLayerOn() {
    return LAYERS.some(function (n) { return state.layers[n].on; });
  }

  function play() {
    unlockAudio();
    if (!state.ctx) return;
    if (state.pauseHandle) {
      clearTimeout(state.pauseHandle);
      state.pauseHandle = null;
    }
    if (!anyLayerOn()) state.layers.pink.on = true;
    LAYERS.forEach(function (n) { applyLayer(n); });
    state.playing = true;
    if (state.timerMin > 0) startTimer(state.timerMin, true);
    else scheduleMaster(true);
  }

  function pause() {
    clearTimer();
    state.timerMin = 0;
    state.playing = false;
    const ctx = state.ctx;
    if (!ctx) return;
    const p = state.master.gain;
    const now = ctx.currentTime;
    p.cancelScheduledValues(now);
    p.setValueAtTime(p.value, now);
    p.linearRampToValueAtTime(0, now + PAUSE_FADE);
    if (state.pauseHandle) clearTimeout(state.pauseHandle);
    state.pauseHandle = setTimeout(function () {
      state.pauseHandle = null;
      if (state.playing) return;
      const done = function () {
        if (state.playing) {
          // Play was pressed while the suspend was in flight.
          ctx.resume().catch(function () {});
          scheduleMaster(true);
          return;
        }
        const t = ctx.currentTime;
        p.cancelScheduledValues(t);
        p.setValueAtTime(state.masterVol, t);
      };
      ctx.suspend().then(done, done);
    }, 350);
  }

  function onCtxState() {
    const s = state.ctx.state;
    if (s !== 'running' && state.playing && !state.pauseHandle) {
      // The system interrupted playback (phone call, iOS audio session).
      state.playing = false;
      clearTimer();
    }
    render();
  }

  /* ===== Section 4: sleep timer ===== */
  function clearTimer() {
    if (state.timerHandle) clearTimeout(state.timerHandle);
    if (state.tickHandle) clearInterval(state.tickHandle);
    state.timerHandle = null;
    state.tickHandle = null;
    state.timerEnd = null;
    state.timerFade = 0;
  }

  function startTimer(min, fromZero) {
    clearTimer();
    if (!state.ctx || !state.playing) return;
    if (min <= 0) {
      scheduleMaster(!!fromZero);
      return;
    }
    const durationSec = min * 60;
    state.timerFade = Math.min(TIMER_FADE_MAX, durationSec / 4);
    state.timerEnd = state.ctx.currentTime + durationSec;
    scheduleMaster(!!fromZero);
    state.timerHandle = setTimeout(timerFinished, durationSec * 1000 + 500);
    state.tickHandle = setInterval(renderStatus, 1000);
  }

  function timerFinished() {
    const ctx = state.ctx;
    if (!ctx) return;
    // Wall clock and audio clock can drift; wait for the audio ramp to land.
    if (state.timerEnd !== null && ctx.state === 'running') {
      const left = state.timerEnd - ctx.currentTime;
      if (left > 0.05) {
        state.timerHandle = setTimeout(timerFinished, left * 1000 + 500);
        return;
      }
    }
    clearTimer();
    state.playing = false;
    state.timerMin = 0;
    const p = state.master.gain;
    const restore = function () {
      if (state.playing) return;
      const t = ctx.currentTime;
      p.cancelScheduledValues(t);
      p.setValueAtTime(state.masterVol, t);
    };
    ctx.suspend().then(restore, restore);
    render();
    saveSettings();
  }

  /* ===== Section 5: persistence ===== */
  function clampVol(x) {
    if (typeof x !== 'number' || !isFinite(x)) return null;
    return Math.min(1, Math.max(0, x));
  }

  function loadSettings() {
    let data = null;
    try {
      data = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch (e) {
      data = null;
    }
    const ok = !!data && typeof data === 'object' && data.v === 1;
    const saved = ok && data.layers && typeof data.layers === 'object' ? data.layers : null;

    LAYERS.forEach(function (n) {
      const d = DEFAULTS.layers[n];
      const L = state.layers[n];
      const src = saved && saved[n] && typeof saved[n] === 'object' ? saved[n] : null;
      L.on = src && 'on' in src ? !!src.on : d.on;
      const v = src ? clampVol(src.vol) : null;
      L.vol = v === null ? d.vol : v;
    });

    const m = ok ? clampVol(data.master) : null;
    state.masterVol = m === null ? DEFAULTS.master : m;
    state.timerMin = ok && TIMER_CHOICES.indexOf(data.timerMin) !== -1 ? data.timerMin : DEFAULTS.timerMin;
  }

  function snapshot() {
    const layers = {};
    LAYERS.forEach(function (n) {
      layers[n] = { on: state.layers[n].on, vol: state.layers[n].vol };
    });
    return { v: 1, layers: layers, master: state.masterVol, timerMin: state.timerMin };
  }

  let saveHandle = null;
  function writeSettings() {
    saveHandle = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot()));
    } catch (e) { /* storage unavailable; mix just will not persist */ }
  }
  function saveSettings() {
    if (saveHandle) clearTimeout(saveHandle);
    saveHandle = setTimeout(writeSettings, 250);
  }

  /* ===== Section 6: UI binding and rendering ===== */
  const els = {
    status: document.getElementById('status'),
    note: document.getElementById('iosNote'),
    play: document.getElementById('btnPlay'),
    layers: document.getElementById('layers'),
    master: document.getElementById('masterVol'),
    masterVal: document.getElementById('masterVal'),
    seg: document.getElementById('timerSeg'),
    cards: {
      white: document.getElementById('layerWhite'),
      pink: document.getElementById('layerPink'),
      brown: document.getElementById('layerBrown')
    }
  };

  const IS_IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

  function fmt(sec) {
    const s = Math.max(0, Math.ceil(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function statusText() {
    if (state.unsupported) return 'This browser cannot play generated sound';
    if (state.playing && state.timerEnd !== null && state.ctx) {
      return 'Sleeping in ' + fmt(state.timerEnd - state.ctx.currentTime);
    }
    if (state.playing) return 'Playing';
    if (!state.ctx) return 'Tap play to begin';
    return 'Paused';
  }

  function renderStatus() {
    const t = statusText();
    if (els.status.textContent !== t) els.status.textContent = t;
  }

  function render() {
    LAYERS.forEach(function (n) {
      const L = state.layers[n];
      const card = els.cards[n];
      const pct = Math.round(L.vol * 100);
      const range = card.querySelector('.range');
      card.querySelector('.toggle').setAttribute('aria-pressed', String(L.on));
      card.querySelector('.lstate').textContent = L.on ? 'On' : 'Off';
      card.classList.toggle('on', L.on);
      card.classList.toggle('off', !L.on);
      range.value = String(pct);
      range.style.setProperty('--p', pct + '%');
    });

    const mp = Math.round(state.masterVol * 100);
    els.master.value = String(mp);
    els.master.style.setProperty('--p', mp + '%');
    els.masterVal.textContent = String(mp);

    els.play.setAttribute('aria-pressed', String(state.playing));

    const segs = els.seg.querySelectorAll('button[data-min]');
    for (let i = 0; i < segs.length; i++) {
      segs[i].setAttribute('aria-pressed', String(Number(segs[i].dataset.min) === state.timerMin));
    }

    els.note.hidden = !IS_IOS;
    renderStatus();
  }

  els.play.addEventListener('click', function () {
    unlockAudio();
    if (state.playing) pause();
    else play();
    render();
    saveSettings();
  });

  els.layers.addEventListener('click', function (e) {
    const t = e.target.closest('.toggle');
    if (!t) return;
    const name = t.dataset.layer;
    const L = state.layers[name];
    L.on = !L.on;
    if (L.on) {
      unlockAudio();
      if (state.playing) applyLayer(name);
      else play();
    } else {
      applyLayer(name);
      if (state.playing && !anyLayerOn()) pause();
    }
    render();
    saveSettings();
  });

  els.layers.addEventListener('input', function (e) {
    const r = e.target.closest('.range');
    if (!r) return;
    const L = state.layers[r.dataset.layer];
    L.vol = Number(r.value) / 100;
    if (L.on) applyLayer(r.dataset.layer, SLIDER_FADE);
    render();
    saveSettings();
  });

  els.master.addEventListener('input', function () {
    setMaster(Number(els.master.value) / 100);
    render();
    saveSettings();
  });

  els.seg.addEventListener('click', function (e) {
    const b = e.target.closest('button[data-min]');
    if (!b) return;
    const min = Number(b.dataset.min);
    state.timerMin = min;
    if (state.playing) startTimer(min, false);
    render();
    saveSettings();
  });

  /* ===== Section 7: init ===== */
  loadSettings();
  render();

  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') render();
  });
  window.addEventListener('pagehide', function () {
    if (saveHandle) {
      clearTimeout(saveHandle);
      writeSettings();
    }
  });
})();
</script>
</body>
</html>
